name: Build AdShield Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Read version name for artifact naming
        id: version
        run: |
          VERSION_NAME=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee test-output.log

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build-output.log

      - name: Rename APK with version number
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/AdShield_v${{ steps.version.outputs.version_name }}.apk"

      - name: Verify APK signature (apksigner)
        run: |
          set -e
          APK_PATH="out/AdShield_v${{ steps.version.outputs.version_name }}.apk"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH"
          echo "--- APK signature verified OK ---"
          ls -la "$APK_PATH"
          sha256sum "$APK_PATH" | tee apk.sha256
          {
            echo "### APK Signature & Integrity"
            echo "- File: \`AdShield_v${{ steps.version.outputs.version_name }}.apk\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 apk.sha256)\`"
            echo "- Size: $(stat -c%s "$APK_PATH") bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdShield_v${{ steps.version.outputs.version_name }}
          path: out/*.apk

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p fail-logs
          # Console output mentah dari step test & build — ini yang tadi
          # HILANG di run 31051130336 (kegagalan sebelum ada report/mapping/
          # test-result file sama sekali, jadi semua find di bawah nihil).
          for f in test-output.log build-output.log; do
            [ -f "$f" ] && cp "$f" fail-logs/
          done
          # R8/minify missing-rules & mapping
          find app/build/outputs/mapping -type f \( -name "missing_rules.txt" -o -name "*.txt" \) -exec cp --parents {} fail-logs/ \; 2>/dev/null || true
          # Lint / test / build reports (html+xml, kecil, cukup buat baca cepat)
          find app/build/reports -type f \( -name "*.txt" -o -name "*.xml" \) -exec cp --parents {} fail-logs/ \; 2>/dev/null || true
          # JUnit unit test result XML (testDebugUnitTest) — beda folder dari reports/
          find app/build/test-results -type f -name "*.xml" -exec cp --parents {} fail-logs/ \; 2>/dev/null || true
          # Ringkasan gagal yang paling relevan (tail dari step summary bawaan Actions)
          {
            echo "Build FAILED - run ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "Commit: ${{ github.sha }}"
            echo "Timestamp (UTC): $(date -u +%Y%m%d_%H%M%S)"
          } > fail-logs/FAILURE_SUMMARY.txt
          echo "fail_ts=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"

      - name: Upload failure log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_${{ env.fail_ts }}_run${{ github.run_id }}
          path: fail-logs/**
          retention-days: 14
          if-no-files-found: warn

      - name: Publish GitHub Release with APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: AdShield v${{ steps.version.outputs.version_name }}
          files: out/*.apk
          generate_release_notes: true
          make_latest: true

  # v3.29.0 — libXray Android build feasibility PoC (roadmap langkah 2,
  # PROJECT_STATE.md). Completely independent job (no `needs:`), so it can
  # never delay or block the `build` job above or the GitHub Release it
  # publishes — this is ONLY here to answer one question with a real CI
  # log instead of a guess: "does XTLS/libXray (MIT-licensed official
  # mobile wrapper for Xray-core, which natively supports the WireGuard
  # 'reserved' bytes WARP needs — see CHANGELOG.md v3.28.0/v3.29.0) even
  # build for Android on THIS project's runners?" continue-on-error is
  # set deliberately: a red result here must never look like "the app is
  # broken" in the Actions UI — it just means the next session needs to
  # read fail-logs and adjust toolchain versions, same as any other CI
  # iteration.
  libxray-poc:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # v3.29.0 pinned 1.21.6 (SaeedDev94/Xray's documented version) — WRONG,
          # see libxray-poc-log run #1: golang.org/x/mobile's current release
          # needs go>=1.25.0, and gomobile's own `go mod tidy` bootstrap then
          # escalated to demanding go1.26 via GOTOOLCHAIN auto-download, which
          # failed ("toolchain not available") rather than actually needing
          # 1.26 to exist — see GOTOOLCHAIN=local below, which stops that
          # escalation instead of chasing it version-by-version blind.
          go-version: '1.25'

      - name: Pin Go toolchain (no further auto-download)
        # v3.30.0: without this, `go mod tidy` (run internally by gomobile
        # init/bind) reads GOTOOLCHAIN=auto (Go's default since 1.21) and, on
        # hitting ANY transitive dependency whose go.mod declares a newer
        # `toolchain` line, tries to silently download that exact version —
        # which is what failed last run (go1.26 "not available" on this
        # runner/network). Forcing `local` makes Go use ONLY the 1.25.x just
        # installed above and fail with a clear "go.mod requires go >= X"
        # message if that's still not enough — a real, actionable next data
        # point instead of an opaque download error.
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK side-by-side package
        run: |
          set -x
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Clone libXray
        run: git clone --depth 1 https://github.com/XTLS/libXray.git

      - name: Install gomobile
        working-directory: libXray
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Attempt Android AAR build (feasibility only)
        id: build_attempt
        continue-on-error: true
        working-directory: libXray
        run: |
          set -o pipefail
          python3 build/main.py android 2>&1 | tee ../libxray-build.log

      - name: Report result to step summary
        run: |
          {
            echo "### libXray Android PoC — roadmap langkah 2"
            if [ "${{ steps.build_attempt.outcome }}" = "success" ]; then
              echo "✅ BUILD SUKSES — AAR ada, cek artifact 'libxray-poc-log'."
              find libXray -name "*.aar" -exec echo "  - {}" \;
            else
              echo "❌ Build gagal (diharapkan mungkin di percobaan pertama)."
              echo "Lihat artifact 'libxray-poc-log' → libxray-build.log,"
              echo "laporkan isinya ke sesi Claude berikutnya untuk iterasi"
              echo "(JANGAN diklaim 'sudah fix' tanpa log ini hijau)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PoC log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libxray-poc-log
          path: |
            libxray-build.log
            libXray/**/*.aar
          if-no-files-found: warn
          retention-days: 14
